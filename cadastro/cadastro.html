<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>
            LZ: Cadastre-se no site
        </h1>
        <hr>
    </header>
    <main>
        <form>
            <label>
                Nome Completo:
            </label>
            <input type="text" required maxlength="200" placeholder="Seu Nome Completo">
            <br>
            <br>
            <label>
                E-mail:
            </label>
            <input type="email" required maxlength="200" placeholder="Seu E-mail">
            <br>
            <br>
            <label>
                Senha:
            </label>
            <input type="password" required maxlength="200" placeholder="Sua Senha">
            <br>
            <br>
            <label>
                Confirmar Senha:
            </label>
            <input type="password" required maxlength="200" placeholder="Confirme a Senha">
            <br>
            <br>
            <label>
                RG:
            </label>
            <input type="text" required maxlength="9" placeholder="Seu RG">
            <br>
            <br>
            <label>
                CPF
            </label>
            <input type="number" required maxlength="11" placeholder="Seu CPF">
            <br>
            <br>
            <label>
                Endereço
            </label>
            <input type="text" required maxlength="300" placeholder="Seu Endereço">
            <br>
            <br>
            <label>
                CEP
            </label>
            <input type="number" required maxlength="8" placeholder="Seu CEP">
            <br>
            <br>
            <label>
                Cidade
            </label>
            <input type="text" required maxlength="200" placeholder="Sua Cidade">
            <br>
            <br>
            <label>
                Estado
            </label>
            <input type="text" required maxlength="200" placeholder="Seu Estado">
            <br>
            <br>
            <label>
                País
            </label>
            <input type="text" required maxlength="200" placeholder="Seu país">
            <br>
            <br>
            <label>
                Data de Nascimento 
            </label>
            <input type="date" required>
            <br>
            <br>
            <button type="submit" formaction="../login/login.html">Concluir</button>
        </form>
    </main>

</body>

</html>
